[project]
name = "capybench"
version = "1.0.0"
description = "CapyDB competitive benchmark harness — throughput, isolation, branching, cold-start"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "psycopg[binary]>=3.3.4",
    "matplotlib>=3.11.0",
]

[project.scripts]
capybench = "capybench.cli:main"

[dependency-groups]
dev = [
    "ruff>=0.15.20",
    "pytest>=9.1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/capybench"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
